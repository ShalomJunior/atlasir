[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlasir"
version = "0.1.0"
description = "Adaptive information retrieval under relevance and latency constraints."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Shalom NUKUNU" }]
dependencies = ["ir-measures>=0.3.7,<0.5", "bm25s>=0.2,<0.3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dense = ["torch==2.9.1", "transformers==4.57.1", "safetensors==0.6.2"]
search = ["faiss-cpu==1.13.2"]

[project.scripts]
atlasir = "atlasir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlasir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
