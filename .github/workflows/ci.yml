name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv
        run: python3 -m pip install uv==0.11.26
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked environment
        run: uv sync --locked --extra search --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked --extra search ruff check .
      - name: Check formatting
        run: uv run --locked --extra search ruff format --check .
      - name: Run CPU fixture tests
        run: uv run --locked --extra search pytest
      - name: Run package command
        run: uv run --locked --extra search atlasir smoke
      - name: Build distributable
        run: uv build
      - name: Install wheel in a separate environment
        run: |
          uv venv --python ${{ matrix.python-version }} .scratch/wheel-env
          uv pip install --python .scratch/wheel-env/bin/python --no-deps dist/*.whl
      - name: Check wheel outside the source directory
        working-directory: ${{ runner.temp }}
        run: '"$GITHUB_WORKSPACE/.scratch/wheel-env/bin/python" -m atlasir smoke'
